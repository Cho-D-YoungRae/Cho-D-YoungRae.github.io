name: 기능·디자인 개선
description: 블로그의 기능이나 디자인을 개선합니다
title: "[기능] "
labels: ["기능"]
body:
  - type: textarea
    id: current
    attributes:
      label: 지금 상태
      description: 현재 어떻게 동작하는지 적어주세요.

  - type: textarea
    id: desired
    attributes:
      label: 바라는 상태
      description: 어떻게 바뀌었으면 하는지 적어주세요.
    validations:
      required: true

  - type: textarea
    id: reference
    attributes:
      label: 참고 사례
      description: 참고할 사이트, 구현, 스크린샷 등
