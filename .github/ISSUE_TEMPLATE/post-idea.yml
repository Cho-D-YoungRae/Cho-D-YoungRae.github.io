name: 글감 등록
description: 쓰고 싶은 글 주제를 등록합니다
title: "[글감] "
labels: ["글감"]
body:
  - type: textarea
    id: content
    attributes:
      label: 다룰 내용
      description: 이 글에서 무엇을 쓸지 적어주세요. 목차 초안이어도 좋습니다.
      placeholder: |
        -
        -
    validations:
      required: true

  - type: input
    id: tags
    attributes:
      label: 예상 태그
      description: 게시글 frontmatter의 tags에 들어갈 값입니다. 쉼표로 구분해주세요.
      placeholder: Claude Code, AX

  - type: textarea
    id: references
    attributes:
      label: 참고 자료
      description: 링크, 읽을거리, 관련 저장소 등

  - type: textarea
    id: motivation
    attributes:
      label: 쓰려는 이유·목표
      description: 이 글로 무엇을 남기고 싶은지 적어주세요.
